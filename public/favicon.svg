<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="gradientPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    
    <linearGradient id="borderGradient" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#07090e" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Premium Dark Squircle Background -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="#07090e" stroke="url(#borderGradient)" stroke-width="2.5" />
  
  <!-- The Ultra-Sleek 'B' Logo -->
  <path 
    d="M32 25 h20 c8 0 16 4 16 14 c0 7 -4 11 -10 13 c8 2 13 8 13 16 c0 11 -9 17 -18 17 h-21 z m14 12 v14 h7 c4 0 7 -2 7 -7 c0 -5 -3 -7 -7 -7 z m0 24 v16 h8 c5 0 8 -3 8 -8 c0 -5 -3 -8 -8 -8 z" 
    fill="url(#gradientPrimary)" 
    fill-rule="evenodd" 
    filter="url(#glow)" 
  />
</svg>
